[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "andocgen"
version = "0.1.0"
description = "Automatic technical documentation generator from source code using LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.86",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "datamodel-code-generator>=0.26",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
andocgen = "andocgen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/andocgen"]
omit = ["src/andocgen/generated/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "eval",
    "examples/*/generated_docs*",
    "generated_docs",
    "htmlcov",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/andocgen/generated/**" = ["ALL"]

[tool.mypy]
python_version = "3.11"
packages = ["andocgen"]
mypy_path = "src"
strict = false
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["src/andocgen/generated/"]
