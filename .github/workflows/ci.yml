name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Smoke test CLI
        run: andocgen --help

      - name: Verify generated config models
        run: |
          ./scripts/generate_config_models.sh
          git diff --exit-code src/andocgen/generated/config_models.py

      - name: Run tests with coverage gate
        run: pytest --cov=andocgen --cov-report=term-missing --cov-fail-under=85
